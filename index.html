    <!-- Structured Data (JSON-LD: WebSite + EducationalOrganization + FAQPage) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "COMSATSPrepHub",
            "url": "https://comsatsprephub.vercel.app/",
            "description": "Exam-preparation platform for COMSATS University students with verified past papers, practice quizzes, AI quiz generation, flashcards, and SGPA/CGPA calculator.",
            "publisher": {
              "@type": "EducationalOrganization",
              "name": "COMSATSPrepHub Student Team",
              "url": "https://comsatsprephub.vercel.app/",
              "logo": {
                "@type": "ImageObject",
                "url": "https://comsatsprephub.vercel.app/logo.png"
              }
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Are the past papers on COMSATSPrepHub verified?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes, all past examination papers and model answer keys are contributed by university high-scorers and verified before publishing."
                }
              },
              {
                "@type": "Question",
                "name": "How does the COMSATS SGPA/CGPA calculator work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Our GPA calculator adheres strictly to the official COMSATS University 4.00 grading scale and credit-hour weightages, including course retakes and sessional marks."
                }
              },
              {
                "@type": "Question",
                "name": "Can I use COMSATSPrepHub without creating an account?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes! Guest students can browse past papers, practice quizzes, flashcards, and use the GPA calculator immediately."
                }
              }
            ]
          }
        ]
      }
